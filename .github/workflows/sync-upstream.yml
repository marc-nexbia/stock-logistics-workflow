name: Sync OCA stock-logistics-workflow 19.0

on:
  schedule:
    - cron: '42 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-oca-stock-logistics-workflow-19
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'marc-nexbia/stock-logistics-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge official OCA stock-logistics-workflow 19.0 updates without forcing changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPOSITORY}/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -f branch='19.0' > sync-result.json
          {
            echo '## OCA stock-logistics-workflow 19.0 synchronization'
            echo 'Upstream: https://github.com/OCA/stock-logistics-workflow/tree/19.0'
            echo 'Target: https://github.com/marc-nexbia/stock-logistics-workflow/tree/19.0'
            echo '```json'
            cat sync-result.json
            echo '```'
            echo 'No force push or reset is used. Conflicts fail the workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
